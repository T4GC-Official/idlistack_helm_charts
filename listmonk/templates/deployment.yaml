apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "listmonk.fullname" . }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "listmonk.fullname" . }}
  template:
    metadata:
      labels:
        app: {{ include "listmonk.fullname" . }}
    spec:

      initContainers:
        - name: init-postgres
          image: busybox
          command: ["sh", "-c", "chown -R 999:999 /var/lib/postgresql/data"]
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data

        - name: init-listmonk
          image: busybox
          command: ["sh", "-c", "chown -R 1000:1000 /listmonk/data"]
          volumeMounts:
            - name: listmonk-data
              mountPath: /listmonk/data

      containers:

        # ---------------- POSTGRES ----------------
        - name: postgres
          image: postgres:17-alpine
          ports:
            - containerPort: 5432

          env:
            - name: POSTGRES_USER
              value: {{ .Values.database.postgres.user | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.database.postgres.password | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.database.postgres.db | quote }}

          resources:
            requests:
              cpu: {{ .Values.resources.postgres.requests.cpu }}
              memory: {{ .Values.resources.postgres.requests.memory }}
            limits:
              cpu: {{ .Values.resources.postgres.limits.cpu }}
              memory: {{ .Values.resources.postgres.limits.memory }}

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U {{ .Values.database.postgres.user }} -d {{ .Values.database.postgres.db }}
            initialDelaySeconds: 10
            periodSeconds: 10

          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data

        # ---------------- LISTMONK ----------------
        - name: listmonk
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 9000

          command:
            - sh
            - -c
            - |
              ./listmonk --install --idempotent --yes --config '' &&
              ./listmonk --upgrade --yes --config '' &&
              ./listmonk --config ''

          env:
            - name: LISTMONK_db__host
              value: "127.0.0.1"
            - name: LISTMONK_db__port
              value: {{ .Values.database.postgres.port | quote }}
            - name: LISTMONK_db__user
              value: {{ .Values.database.postgres.user | quote }}
            - name: LISTMONK_db__password
              value: {{ .Values.database.postgres.password | quote }}
            - name: LISTMONK_db__database
              value: {{ .Values.database.postgres.db | quote }}
            - name: LISTMONK_db__ssl_mode
              value: disable
            - name: LISTMONK_app__address
              value: 0.0.0.0:9000
            - name: LISTMONK_app__public_url
              value: {{ printf "https://%s" (index .Values.ingress.hosts 0 "host") | quote }}

          resources:
            requests:
              cpu: {{ .Values.resources.listmonk.requests.cpu }}
              memory: {{ .Values.resources.listmonk.requests.memory }}
            limits:
              cpu: {{ .Values.resources.listmonk.limits.cpu }}
              memory: {{ .Values.resources.listmonk.limits.memory }}

          readinessProbe:
            httpGet:
              path: /health
              port: 9000
            initialDelaySeconds: 15
            periodSeconds: 10

          volumeMounts:
            - name: listmonk-data
              mountPath: /listmonk/data

      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: {{ include "listmonk.fullname" . }}-postgres-pvc

        - name: listmonk-data
          persistentVolumeClaim:
            claimName: {{ include "listmonk.fullname" . }}-listmonk-pvc
