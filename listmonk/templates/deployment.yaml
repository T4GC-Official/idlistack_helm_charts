apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "listmonk.fullname" . }}
  labels:
    {{- include "listmonk.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "listmonk.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "listmonk.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "listmonk.fullname" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: listmonk
        {{- with .Values.securityContext }}
        securityContext:
          {{- toYaml . | nindent 12 }}
        {{- end }}
        image: "{{ .Values.image.listmonk.repository }}:{{ .Values.image.listmonk.tag }}"
        imagePullPolicy: {{ .Values.image.listmonk.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.listmonk.port }}
          protocol: TCP
        - name: admin
          containerPort: {{ .Values.listmonk.adminPort }}
          protocol: TCP
        envFrom:
        - configMapRef:
            name: {{ include "listmonk.fullname" . }}-config
        env:
        - name: LISTMONK_db__password
          valueFrom:
            secretKeyRef:
              name: {{ include "listmonk.fullname" . }}-secret
              key: LISTMONK_db__password
        resources:
          {{- toYaml .Values.listmonk.resources | nindent 12 }}
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 20
          periodSeconds: 5
        volumeMounts:
        - name: listmonk-data
          mountPath: /listmonk
      
      - name: postgres
        {{- with .Values.securityContext }}
        securityContext:
          {{- toYaml . | nindent 12 }}
        {{- end }}
        image: "{{ .Values.image.postgres.repository }}:{{ .Values.image.postgres.tag }}"
        imagePullPolicy: {{ .Values.image.postgres.pullPolicy }}
        ports:
        - name: postgres
          containerPort: {{ .Values.postgres.port }}
          protocol: TCP
        env:
        - name: POSTGRES_DB
          value: {{ .Values.database.name | quote }}
        - name: POSTGRES_USER
          value: {{ .Values.database.user | quote }}
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "listmonk.fullname" . }}-secret
              key: postgres-password
        resources:
          {{- toYaml .Values.postgres.resources | nindent 12 }}
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U {{ .Values.database.user }}
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U {{ .Values.database.user }}
          initialDelaySeconds: 20
          periodSeconds: 5
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data

      volumes:
      - name: listmonk-data
        persistentVolumeClaim:
          claimName: {{ include "listmonk.fullname" . }}-listmonk
      - name: postgres-data
        persistentVolumeClaim:
          claimName: {{ include "listmonk.fullname" . }}-postgres
