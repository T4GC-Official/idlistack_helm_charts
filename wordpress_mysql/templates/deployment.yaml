apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "wordpress.fullname" . }}
  labels:
    {{- include "wordpress.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "wordpress.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "wordpress.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "wordpress.fullname" . }}
      containers:
      # WordPress Container
      - name: wordpress
        image: "{{ .Values.image.wordpress.repository }}:{{ .Values.image.wordpress.tag }}"
        imagePullPolicy: {{ .Values.image.wordpress.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.wordpress.port }}
          protocol: TCP
        envFrom:
        - configMapRef:
            name: {{ include "wordpress.fullname" . }}-config
        env:
        - name: WORDPRESS_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "wordpress.fullname" . }}-secret
              key: wordpress-db-password
        - name: WORDPRESS_CONFIG_EXTRA
          value: |
            define('WP_HOME','https://wordpress.example.com');
            define('WP_SITEURL','https://wordpress.example.com');
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 20
          periodSeconds: 5
        resources:
          {{- toYaml .Values.wordpress.resources | nindent 12 }}
        volumeMounts:
        - name: wordpress-data
          mountPath: /var/www/html
      # MySQL Sidecar Container
      - name: mysql
        image: "{{ .Values.image.mysql.repository }}:{{ .Values.image.mysql.tag }}"
        ports:
        - name: mysql
          containerPort: {{ .Values.mysql.port }}
          protocol: TCP
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "wordpress.fullname" . }}-secret
              key: mysql-root-password
        - name: MYSQL_DATABASE
          value: "{{ .Values.database.mysql.database }}"
        - name: MYSQL_USER
          value: "{{ .Values.database.mysql.user }}"
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "wordpress.fullname" . }}-secret
              key: mysql-password
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - mysqladmin ping -h 127.0.0.1 -u root -p$MYSQL_ROOT_PASSWORD
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - mysql -h 127.0.0.1 -u root -p$MYSQL_ROOT_PASSWORD -e 'SELECT 1'
          initialDelaySeconds: 20
          periodSeconds: 5
        resources:
          {{- toYaml .Values.mysql.resources | nindent 12 }}
        volumeMounts:
        - name: mysql-data
          mountPath: /var/lib/mysql
      volumes:
      - name: wordpress-data
        persistentVolumeClaim:
          claimName: {{ include "wordpress.fullname" . }}-wordpress
      - name: mysql-data
        persistentVolumeClaim:
          claimName: {{ include "wordpress.fullname" . }}-mysql
