apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mattermost.fullname" . }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "mattermost.fullname" . }}
  template:
    metadata:
      labels:
        app: {{ include "mattermost.fullname" . }}
        orgname: {{ .Values.labels.organization }}
    spec:

      # INIT CONTAINER (simplified)
      initContainers:
        - name: init-mysql
          image: busybox
          command: ["sh", "-c", "chown -R 999:999 /var/lib/mysql"]
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql

        - name: init-mattermost
          image: busybox
          command: ["sh", "-c", "chown -R 2000:2000 /mattermost/data"]
          volumeMounts:
            - name: mattermost-data
              mountPath: /mattermost/data

      containers:

        # ---------------- MYSQL ----------------
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - mysqladmin ping -h 127.0.0.1 -u root -p${MYSQL_ROOT_PASSWORD}
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5

          env:
            - name: MYSQL_ROOT_PASSWORD
              value: {{ .Values.database.mysql.rootPassword | quote }}
            - name: MYSQL_DATABASE
              value: {{ .Values.database.mysql.database | quote }}
            - name: MYSQL_USER
              value: {{ .Values.database.mysql.user | quote }}
            - name: MYSQL_PASSWORD
              value: {{ .Values.database.mysql.password | quote }}

          resources:
            requests:
              cpu: {{ .Values.resources.mysql.requests.cpu }}
              memory: {{ .Values.resources.mysql.requests.memory }}
            limits:
              cpu: {{ .Values.resources.mysql.limits.cpu }}
              memory: {{ .Values.resources.mysql.limits.memory }}

          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql

        # ---------------- MATTERMOST ----------------
        - name: mattermost
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 8065

          readinessProbe:
            httpGet:
              path: /
              port: 8065
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5

          env:
            - name: MM_SERVICESETTINGS_SITEURL
              value: {{ printf "https://%s" (required "ingress.hosts[0].host is required" (index .Values.ingress.hosts 0).host) | quote }}

            - name: MM_SQLSETTINGS_DRIVERNAME
              value: mysql

            - name: MM_SQLSETTINGS_DATASOURCE
              value: "{{ .Values.database.mysql.user }}:{{ .Values.database.mysql.password }}@tcp(127.0.0.1:3306)/{{ .Values.database.mysql.database }}?charset=utf8mb4,utf8&readTimeout=30s&writeTimeout=30s"

          resources:
            requests:
              cpu: {{ .Values.resources.mattermost.requests.cpu }}
              memory: {{ .Values.resources.mattermost.requests.memory }}
            limits:
              cpu: {{ .Values.resources.mattermost.limits.cpu }}
              memory: {{ .Values.resources.mattermost.limits.memory }}

          volumeMounts:
            - name: mattermost-data
              mountPath: /mattermost/data

      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: {{ include "mattermost.fullname" . }}-mysql-pvc

        - name: mattermost-data
          persistentVolumeClaim:
            claimName: {{ include "mattermost.fullname" . }}-mattermost-pvc
