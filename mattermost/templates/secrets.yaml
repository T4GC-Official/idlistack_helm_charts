apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mattermost.fullname" . }}-secret
  labels:
    {{- include "mattermost.labels" . | nindent 4 }}
type: Opaque
data:
  mysql-root-password: {{ .Values.database.mysql.rootPassword | b64enc | quote }}
  mysql-password: {{ .Values.database.mysql.password | b64enc | quote }}
