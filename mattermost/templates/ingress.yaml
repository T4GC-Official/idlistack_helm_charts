apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "mattermost.fullname" . }}-ingress
  annotations:
    kubernetes.io/ingress.class: traefik
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: traefik

  tls:
    - hosts:
        - {{ required "ingress.hosts[0].host is required" (index .Values.ingress.hosts 0).host }}
      secretName: {{ required "ingress.tls[0].secretName is required" (index .Values.ingress.tls 0).secretName }}

  rules:
    - host: {{ required "ingress.hosts[0].host is required" (index .Values.ingress.hosts 0).host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "mattermost.fullname" . }}-service
                port:
                  number: 80
