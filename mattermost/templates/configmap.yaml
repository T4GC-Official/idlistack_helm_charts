apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mattermost.fullname" . }}-config
  labels:
    {{- include "mattermost.labels" . | nindent 4 }}
data:
  config.json: |
    {
      "ServiceSettings": {
        "SiteURL": "https://example.com",
        "WebsocketURL": "",
        "LicenseFileLocation": "",
        "ListenAddress": ":{{ .Values.mattermost.port }}",
        "ConnectionSecurity": "",
        "TLSCertFile": "",
        "TLSKeyFile": "",
        "UseLetsEncrypt": false,
        "LetsEncryptCertificateCacheFile": "./config/letsencrypt.cache",
        "Forward80To443": false,
        "TimeZone": "UTC",
        "Mode": "standalone",
        "MaximumLoginAttempts": 10,
        "SessionLengthWebInHours": 720,
        "SessionLengthMobileInHours": 720,
        "SessionLengthSSOInHours": 24,
        "SessionCacheInMinutes": 10,
        "SessionIdleTimeoutInMinutes": 43200,
        "EnableUserAccessTokens": false,
        "AllowCorsFrom": "",
        "CorsExposedHeaders": "",
        "AllowCrossOriginCredentials": false,
        "WebsocketSecurePort": 443,
        "WebsocketPort": 80,
        "WebserverMode": "gzip",
        "EnableCustomEmoji": true,
        "RestrictCustomEmojiCreation": "all",
        "RestrictPostDelete": "all",
        "AllowEditPost": "always",
        "PostEditTimeLimit": -1,
        "EnableEmojiPicker": true,
        "EnableGifPicker": true,
        "GifProvider": "gfycat",
        "EnablePreviewFeatures": true,
        "EnableUserTypingMessages": true,
        "EnableChannelViewedMessages": true,
        "EnableUserStatuses": true,
        "ExperimentalEnableAuthenticationTransfer": true,
        "ClusterLogTimeoutMilliseconds": 2000,
        "ReadTimeout": 300,
        "WriteTimeout": 300,
        "MaximumPayloadSize": 104857600,
        "AllowedUntrustedInternalConnections": "",
        "EnableOpenTracing": false,
        "EnableSecurityFixAlert": true,
        "EnableInsecureOutgoingConnections": false,
        "AllowedThemes": [],
        "DefaultTheme": "default",
        "DefaultUserLocale": "en",
        "AvailableLocales": "",
        "SQLSettings": {
          "DriverName": "{{ .Values.database.client }}",
          "DataSource": "{{ .Values.database.mysql.user }}:MYSQL_PASSWORD@tcp(localhost:{{ .Values.mysql.port }})/{{ .Values.database.mysql.database }}?charset=utf8mb4,utf8&parseTime=true&loc=Local",
          "DataSourceReplicas": [],
          "DataSourceSearchReplicas": [],
          "MaxIdleConns": 20,
          "ConnMaxLifetimeMilliseconds": 3600000,
          "ConnMaxOpenConns": 300,
          "Trace": false,
          "RecoveryTrace": false,
          "DisableDatabaseSearch": false
        }
      },
      "TeamSettings": {
        "SiteName": "Mattermost",
        "MaxUsersPerTeam": 50,
        "EnableTeamCreation": true,
        "EnableUserCreation": true,
        "EnableOpenServer": false,
        "RestrictCreationToDomains": "",
        "EnableCustomBrand": false,
        "CustomBrandText": "",
        "CustomDescriptionText": "",
        "RestrictDirectMessage": "any",
        "RestrictTeamInvite": "all",
        "RestrictPublicChannelManagement": "all",
        "RestrictPrivateChannelManagement": "all",
        "RestrictPublicChannelCreation": "all",
        "RestrictPrivateChannelCreation": "all",
        "RestrictPublicChannelDeletion": "all",
        "RestrictPrivateChannelDeletion": "all",
        "RestrictPrivateChannelManagementByTeamAdmin": false,
        "RestrictPublicChannelManagementByTeamAdmin": false,
        "EnableXToLeaveChannelsFromLHS": false,
        "UserStatusAwayTimeout": 300,
        "MaxChannelsPerTeam": 50000,
        "MaxNotificationsPerChannel": 1000,
        "EnablePreviewFeatures": true,
        "ExperimentalViewArchivedChannels": false,
        "ExperimentalEnableAutomaticReplies": false,
        "ExperimentalHideTownSquareinLHS": false,
        "ExperimentalTownSquareIsReadOnly": false,
        "LockTeammateNameDisplay": false,
        "TeammateNameDisplay": "username",
        "ExperimentalPrimaryTeam": ""
      }
    }
