apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ghost.fullname" . }}
  labels:
    {{- include "ghost.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "ghost.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- if .Values.podAnnotations }}
      annotations:
        {{- toYaml .Values.podAnnotations | nindent 8 }}
      {{- end }}
      labels:
        {{- include "ghost.selectorLabels" . | nindent 8 }}
    spec:
      {{- if .Values.podSecurityContext }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- end }}
      containers:
        # --- MYSQL SIDE CAR ---
        - name: mysql
          image: {{ .Values.mysql.image }}
          {{- if .Values.securityContext }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- end }}
          resources:
            requests:
              cpu: {{ .Values.mysql.resources.requests.cpu }}
              memory: {{ .Values.mysql.resources.requests.memory }}
            limits:
              cpu: {{ .Values.mysql.resources.limits.cpu }}
              memory: {{ .Values.mysql.resources.limits.memory }}
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "ghost.fullname" . }}-secret
                  key: mysql-root-password
            - name: MYSQL_DATABASE
              value: {{ .Values.database.mysql.database | quote }}
            - name: MYSQL_USER
              value: {{ .Values.database.mysql.user | quote }}
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "ghost.fullname" . }}-secret
                  key: mysql-password
          ports:
            - name: mysql
              containerPort: {{ .Values.mysql.port }}
              protocol: TCP
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - mysqladmin ping -h 127.0.0.1 -u root -p${MYSQL_ROOT_PASSWORD}
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql

        # --- GHOST CONTAINER ---
        - name: ghost
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.securityContext }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- end }}
          resources:
            requests:
              cpu: {{ .Values.ghost.resources.requests.cpu }}
              memory: {{ .Values.ghost.resources.requests.memory }}
            limits:
              cpu: {{ .Values.ghost.resources.limits.cpu }}
              memory: {{ .Values.ghost.resources.limits.memory }}
          env:
            - name: database__client
              value: "mysql"
            - name: database__connection__host
              value: "127.0.0.1"
            - name: database__connection__user
              value: {{ .Values.database.mysql.user | quote }}
            - name: database__connection__password
              valueFrom:
                secretKeyRef:
                  name: {{ include "ghost.fullname" . }}-secret
                  key: mysql-password
            - name: database__connection__database
              value: {{ .Values.database.mysql.database | quote }}
            - name: database__connection__port
              value: {{ .Values.mysql.port | quote }}
            - name: database__connection__reconnect
              value: "true"
            - name: NODE_ENV
              value: {{ .Values.ghost.nodeEnv | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.ghost.port }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: ghost-data
              mountPath: /var/lib/ghost/content
            - name: ghost-config
              mountPath: /var/lib/ghost/config.production.json
              subPath: config.production.json

      volumes:
        - name: ghost-data
          persistentVolumeClaim:
            claimName: {{ include "ghost.fullname" . }}-ghost-pvc
        - name: mysql-data
          persistentVolumeClaim:
            claimName: {{ include "ghost.fullname" . }}-mysql-pvc
        - name: ghost-config
          configMap:
            name: {{ include "ghost.fullname" . }}-config
