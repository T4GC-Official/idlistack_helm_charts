apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ghost.fullname" . }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "ghost.fullname" . }}
  template:
    metadata:
      labels:
        app: {{ include "ghost.fullname" . }}
        orgname: {{ .Values.labels.organization }}
    spec:
      containers:
        # --- MYSQL SIDE CAR ---
        - name: mysql
          image: {{ .Values.mysql.image }}
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1
              memory: 1Gi
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: {{ .Values.database.mysql.rootPassword | quote }}
            - name: MYSQL_DATABASE
              value: {{ .Values.database.mysql.database | quote }}
            - name: MYSQL_USER
              value: {{ .Values.database.mysql.user | quote }}
            - name: MYSQL_PASSWORD
              value: {{ .Values.database.mysql.password | quote }}
          ports:
            - containerPort: 3306

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - mysqladmin ping -h 127.0.0.1 -u root -p${MYSQL_ROOT_PASSWORD}
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5

          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql

        # --- GHOST CONTAINER ---
        - name: ghost
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          env:
            - name: database__client
              value: "mysql"
            - name: database__connection__host
              value: "127.0.0.1"
            - name: database__connection__user
              value: {{ .Values.database.mysql.user | quote }}
            - name: database__connection__password
              value: {{ .Values.database.mysql.password | quote }}
            - name: database__connection__database
              value: {{ .Values.database.mysql.database | quote }}
            - name: database__connection__port
              value: "3306"
            - name: database__connection__reconnect
              value: "true"
            - name: url
              value: "https://{{ (index .Values.ingress.hosts 0).host }}"
            - name: NODE_ENV
              value: "production"
          ports:
            - containerPort: 2368

          readinessProbe:
            httpGet:
              path: /
              port: 2368
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5

          volumeMounts:
            - name: ghost-data
              mountPath: /var/lib/ghost/content

      volumes:
        - name: ghost-data
          persistentVolumeClaim:
            claimName: {{ include "ghost.fullname" . }}-ghost-pvc

        - name: mysql-data
          persistentVolumeClaim:
            claimName: {{ include "ghost.fullname" . }}-mysql-pvc
