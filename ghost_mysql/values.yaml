---
# -- Replica count (not used in current sidecar setup, reserved for future)
replicaCount: 1

image:
  repository: ghost
  tag: "5"
  pullPolicy: IfNotPresent

# -- Ghost specific configuration
ghost:
  port: 2368
  nodeEnv: production
  resources:
    requests:
      cpu: "200m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

# -- MySQL database configuration
mysql:
  image: mysql:8.0
  port: 3306
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "1Gi"

# -- Database credentials
database:
  mysql:
    rootPassword: ""  # Set via Kubernetes Secret or external secret management
    database: ghost
    user: ghost
    password: ""  # Set via Kubernetes Secret or external secret management

# -- Storage configuration
storage:
  ghostSize: 1Gi
  mysqlSize: 2Gi
  storageClass: longhorn

# -- Standard Kubernetes labels for all resources
labels:
  organization: default-org
  environment: production
  appType: ghost_mysql
  region: in-central

# -- Ingress configuration
ingress:
  enabled: true
  hosts:
    - host: #Add Domain
  tls:
    - secretName: #Add Domain
      hosts:
        -  #Add Domain

# -- Service configuration
service:
  type: ClusterIP
  port: 80
  targetPort: 2368

# -- ServiceAccount configuration
serviceAccount:
  create: true
  annotations: {}
  name: ""

# -- Pod annotations
podAnnotations: {}

# -- Pod security context
podSecurityContext: {}

# -- Security context for containers
securityContext: {}
