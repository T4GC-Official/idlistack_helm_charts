apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "whatomate.fullname" . }}
  labels:
    {{- include "whatomate.labels" . | nindent 4 }}
spec:
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "whatomate.fullname" $ }}
                port:
                  number: {{ $.Values.service.port }}
    {{- end }}
