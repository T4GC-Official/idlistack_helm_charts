apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "whatomate.fullname" . }}-config
  labels:
    {{- include "whatomate.labels" . | nindent 4 }}
data:
  DB_HOST: {{ .Values.database.host | quote }}
  DB_PORT: {{ .Values.database.port | quote }}
  DB_USER: {{ .Values.database.user | quote }}
  DB_NAME: {{ .Values.database.name | quote }}
  DB_SSL_MODE: {{ .Values.database.sslMode | quote }}
  DB_MAX_OPEN_CONNS: {{ .Values.database.maxOpenConns | quote }}
  DB_MAX_IDLE_CONNS: {{ .Values.database.maxIdleConns | quote }}
  REDIS_HOST: {{ .Values.redis.host | quote }}
  REDIS_PORT: {{ .Values.redis.port | quote }}
  REDIS_DB: {{ .Values.redis.db | quote }}
  APP_NAME: {{ .Values.appConfig.name | quote }}
  APP_ENVIRONMENT: {{ .Values.appConfig.environment | quote }}
  APP_DEBUG: {{ .Values.appConfig.debug | quote }}
  APP_READ_TIMEOUT: {{ .Values.appConfig.readTimeout | quote }}
  APP_WRITE_TIMEOUT: {{ .Values.appConfig.writeTimeout | quote }}
  JWT_ACCESS_EXPIRY_MINS: {{ .Values.jwt.accessExpiryMins | quote }}
  JWT_REFRESH_EXPIRY_DAYS: {{ .Values.jwt.refreshExpiryDays | quote }}
