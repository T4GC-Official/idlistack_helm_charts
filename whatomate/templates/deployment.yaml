apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "whatomate.fullname" . }}
  labels:
    {{- include "whatomate.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "whatomate.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "whatomate.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "whatomate.fullname" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: whatomate
        {{- with .Values.securityContext }}
        securityContext:
          {{- toYaml . | nindent 12 }}
        {{- end }}
        image: "{{ .Values.image.whatomate.repository }}:{{ .Values.image.whatomate.tag }}"
        imagePullPolicy: {{ .Values.image.whatomate.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.whatomate.port }}
          protocol: TCP
        envFrom:
        - configMapRef:
            name: {{ include "whatomate.fullname" . }}-config
        env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "whatomate.fullname" . }}-secret
              key: DB_PASSWORD
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ include "whatomate.fullname" . }}-secret
              key: JWT_SECRET
        - name: ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "whatomate.fullname" . }}-secret
              key: ENCRYPTION_KEY
        resources:
          {{- toYaml .Values.whatomate.resources | nindent 12 }}
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 20
          periodSeconds: 5
        volumeMounts:
        - name: uploads
          mountPath: /app/uploads

      volumes:
      - name: uploads
        persistentVolumeClaim:
          claimName: {{ include "whatomate.fullname" . }}-uploads
